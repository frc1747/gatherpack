generate_notifications_job:
  class: GenerateNotificationsJob
  queue: default
  schedule: every 5 minutes

# Blobs that never got attached, such as abandoned direct uploads.
purge_unattached_blobs:
  command: "ActiveStorage::Blob.unattached.where(created_at: ..1.day.ago).find_each(&:purge_later)"
  queue: default
  schedule: every day at 4am
